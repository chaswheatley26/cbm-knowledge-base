    <script>
      // Runs before first paint so the app never flashes the wrong theme.
      // Shared across every page on this origin (this app, the landing
      // page, kb/) via the same "cbm-theme" localStorage key — a choice
      // made on one applies everywhere.
      (function () {
        try {
          var stored = localStorage.getItem("cbm-theme");
          var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
